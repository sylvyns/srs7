name: srsp5
description: Registration form with validation, SharedPreferences, Firebase Realtime Database and push notifications.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  firebase_core: any
  firebase_database: any
  firebase_messaging: any
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
